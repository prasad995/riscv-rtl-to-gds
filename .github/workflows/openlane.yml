name: OpenLane ASIC Flow (RTL to GDSII)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physical-design:
    name: Run OpenLane 2 Physical Design Flow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Volare & Download SkyWater 130nm PDK
        run: |
          pip install volare
          volare enable --pdk sky130 0fe599b2afb6708d281543108caf8310912f54af

      - name: Prepare Workspace Permissions
        run: |
          sudo chmod -R 777 ${{ github.workspace }}

      - name: Execute OpenLane 2 Flow in Cloud Container
        run: |
          docker run --rm \
            -v /home/runner/.volare:/home/runner/.volare \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/efabless/openlane2:2.3.10 \
            openlane --pdk sky130 --pdk-root /home/runner/.volare openlane/riscv_core/config.json

      - name: Post-Run Permissions Fix
        if: always()
        run: |
          sudo chmod -R 777 ${{ github.workspace }}

      - name: Collect and Copy GDSII Results to results/
        if: success()
        run: |
          mkdir -p results/physical_design
          # Find and copy the final GDS file
          find openlane/riscv_core/runs -name "*.gds" | head -n 1 | xargs -I{} cp {} results/riscv_core.gds || true
          # Copy final DEF
          find openlane/riscv_core/runs -name "*.def" -path "*/final/*" | head -n 1 | xargs -I{} cp {} results/physical_design/riscv_core_final.def || true
          # Copy post-routing netlist
          find openlane/riscv_core/runs -name "*.nl.v" -path "*/final/*" | head -n 1 | xargs -I{} cp {} results/physical_design/riscv_core_final.nl.v || true
          # Copy flow log
          find openlane/riscv_core/runs -name "flow.log" | head -n 1 | xargs -I{} cp {} results/physical_design/flow.log || true
          # Copy metrics
          find openlane/riscv_core/runs -name "metrics.csv" | head -n 1 | xargs -I{} cp {} results/physical_design/metrics.csv || true
          echo "=== Collected files ==="
          ls -lh results/riscv_core.gds || echo "GDS not found"
          ls -lh results/physical_design/ || echo "No physical design files"

      - name: Commit GDSII and Results to Repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/riscv_core.gds results/physical_design/ || true
          git diff --cached --quiet || git commit -m "ci(gds): add Phase 5 GDSII and physical design outputs [skip ci]"
          git push origin main

      - name: Upload GDSII and Physical Design Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv_core_gdsii_results
          path: |
            openlane/riscv_core/runs/*/final/
            openlane/riscv_core/runs/*/reports/
            openlane/riscv_core/runs/*/flow.log
            openlane/riscv_core/runs/*/metrics.csv
          retention-days: 14
